<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo</title>
<meta name="theme-color" content="#0f2e25">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script>
  // Antes de pintar: tienda desde la URL (/slug), manifest y modo claro/oscuro guardado.
  (function () {
    var slug = (location.pathname.split('/').filter(Boolean)[0] || '').toLowerCase();
    if (!/^[a-z0-9-]+$/.test(slug)) slug = '';
    window.__SLUG = slug;
    if (slug) {
      var l = document.createElement('link');
      l.rel = 'manifest'; l.href = '/tiendas/' + slug + '/manifest.webmanifest';
      document.head.appendChild(l);
      var a = document.createElement('link');
      a.rel = 'apple-touch-icon'; a.href = '/tiendas/' + slug + '/icon-192.png';
      document.head.appendChild(a);
    }
    try {
      var m = localStorage.getItem('modo:' + slug);
      if (m === 'claro' || m === 'oscuro') document.documentElement.dataset.modo = m;
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app" aria-live="polite">
  <div class="cargando"><span class="spinner" aria-hidden="true"></span>Cargando catálogo…</div>
</div>
<div id="toast" role="status" hidden></div>
<script src="/helado.js"></script>
<script src="/arte.js"></script>
<script src="/app.js"></script>
</body>
</html>

[build]
  publish = "sitio"
  # Sin TIENDA_UNICA no hace nada. En el proyecto de una sola tienda (ej. dulceshelados-cl) se define TIENDA_UNICA=<slug>.
  command = "node herramientas/tienda-unica.js"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/tiendas/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
